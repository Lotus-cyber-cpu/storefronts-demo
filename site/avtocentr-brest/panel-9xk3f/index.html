<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дашборд — админ-панель АвтоЦентр Брест</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap&subset=cyrillic" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css?v=20260810e">
<link rel="stylesheet" href="css/admin.css?v=20260810e">
</head>
<body>
<div class="admin-shell" id="admin-shell"></div>

<script src="../js/cars-data.js?v=20260810e"></script>
<script src="js/admin.js?v=20260810e"></script>
<script>
  if (ACBAdmin.mount('dashboard', 'Дашборд', 'Общая сводка по автосалону')) {
    const cars = ACBAdmin.get('cars');
    const leads = ACBAdmin.get('leads');
    const tradein = ACBAdmin.get('tradein');
    const users = ACBAdmin.get('users');

    const kpis = [
      { num: cars.filter(c => c.status === 'instock').length, cap: 'Автомобилей в наличии' },
      { num: leads.filter(l => l.status === 'new').length, cap: 'Новых заявок' },
      { num: tradein.filter(t => t.status !== 'approved').length, cap: 'Оценок в обработке' },
      { num: users.length, cap: 'Сотрудников в системе' },
    ];

    document.getElementById('admin-content').innerHTML = `
      <div class="demo-banner">Демо-режим: данные хранятся локально в вашем браузере (localStorage), сюда ничего не отправляется. Переключите роль сверху, чтобы увидеть, что видит менеджер или бухгалтер.</div>
      <div class="kpi-row">
        ${kpis.map(k => `<div class="kpi-card"><div class="num">${k.num}</div><div class="cap">${k.cap}</div></div>`).join('')}
      </div>
      <div class="panel-card">
        <h2>Последние заявки</h2>
        <div class="table-wrap">
          <table class="admin-table">
            <thead><tr><th>Тип</th><th>Клиент</th><th>Тема</th><th>Дата</th><th>Статус</th></tr></thead>
            <tbody>
              ${leads.slice(0, 5).map(l => `
                <tr>
                  <td>${l.type}</td>
                  <td>${l.name}<br><span style="color:var(--color-text-muted)">${l.phone}</span></td>
                  <td>${l.subject}</td>
                  <td>${l.date}</td>
                  <td>${ACBAdmin.pill(l.status, { new: 'Новая', progress: 'В работе', closed: 'Закрыта' })}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
        <p class="hint"><a href="leads.html">Все заявки →</a></p>
      </div>`;
  }
</script>
</body>
</html>
